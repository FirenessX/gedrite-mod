# See https://docs.minecraftforge.net/en/1.21.x/gettingstarted/modfiles/#modstoml
# There are lots of things you can do with the mods.toml, and not all fields are included with this MDK
# References: https://github.com/MinecraftForge/MDKExamples

modLoader="javafml"
loaderVersion="[65,)"
license="LGPL-3.0-only"
#issueTrackerURL="https://github.com/MyOrganization/MyMod/" #optional
#clientSideOnly=true #optional, default=false

[[mods]]
modId="gedrite"
version="2.2.1"
displayName="Gedrite"
#updateJSONURL="https://example.com/updates.json" #optional
displayURL="https://curseforge.com/minecraft/mc-mods/gedrite" #optional
logoFile="icon.png" #optional
#credits="" #optional
authors="Fireness" #optional
#displayTest="MATCH_VERSION" #optional, default=MATCH_VERSION when not clientSideOnly, else IGNORE_ALL_VERSION

description='''Adds Gedrite in your world. Gedrite is a liquid and useful metal, you can even eat it! See more information in Gedrite Mod page in Curseforge/Modrinth

uk_UA translation by StarmanMine142'''

[[dependencies.gedrite]] #recommended
    modId="forge"
    mandatory=true
    versionRange="[65,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.gedrite]] #recommended
    modId="minecraft"
    mandatory=true
    versionRange="[26.2,26.3,)"
    ordering="NONE"
    side="BOTH"
